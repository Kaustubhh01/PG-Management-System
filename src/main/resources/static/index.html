<!DOCTYPE html>
<html>
<head>
    <title>StayEase | Smart PG & Hostel Management</title>

    <style>
        body {
          font-family: 'Segoe UI', sans-serif;
          margin: 0;
          height: 100vh;
          background: linear-gradient(135deg, #667eea, #764ba2);
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .main-container {
          display: flex;
          width: 900px;
          height: 500px;
          background: white;
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        /* LEFT SIDE */
        .left {
          width: 50%;
          position: relative;
          overflow: hidden;
        }

        .left img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }

        .overlay {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0,0,0,0.5);
          color: white;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 30px;
        }

        .overlay h1 {
          margin-bottom: 10px;
        }

        /* RIGHT SIDE */
        .right {
          width: 50%;
          padding: 40px;
          text-align: center;
          background: #f9f9f9;
        }

        .right h2 {
          margin-bottom: 20px;
          color: #333;
        }

        input {
          width: 90%;
          padding: 10px;
          margin: 10px 0;
          border-radius: 6px;
          border: 1px solid #ccc;
          outline: none;
          transition: 0.3s;
        }

        input:focus {
          border-color: #667eea;
          box-shadow: 0 0 5px rgba(102,126,234,0.5);
        }

        button {
          width: 95%;
          padding: 10px;
          background: #667eea;
          color: white;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          font-size: 16px;
          transition: 0.3s;
        }

        button:hover {
          background: #5a67d8;
          transform: scale(1.05);
        }

        .success {
          color: green;
          margin-top: 10px;
          display: none;
        }

        .login-link {
          margin-top: 15px;
          font-size: 14px;
        }

        .login-link a {
          color: #667eea;
          text-decoration: none;
          font-weight: bold;
        }

    </style>
</head>

<body>

<div class="main-container">

    <!-- LEFT SIDE IMAGE -->
    <div class="left">
        <img src="https://images.unsplash.com/photo-1554995207-c18c203602cb" alt="PG Room">

        <div class="overlay">
            <h1>StayEase</h1>
            <p>Smart PG & Hostel Management System</p>
            <p>Find rooms, manage bookings, and live comfortably.</p>
        </div>
    </div>

    <!-- RIGHT SIDE FORM -->
    <div class="right">
        <h2>Create Account</h2>

        <form id="form">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>

            <button type="submit">Register</button>
        </form>

        <p class="success" id="msg">✔ Registration Successful</p>

        <div class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

</div>

<script>
    document.getElementById("form").onsubmit = async function(e){
      e.preventDefault();

      const response = await fetch(
    		    "http://localhost:8081/users/register",
    		    {
    		        method: "POST",
    		        headers:{
    		            "Content-Type":"application/json"
    		        },
    		        body:JSON.stringify({
    		            name:document.getElementById("name").value,
    		            email:document.getElementById("email").value,
    		            password:document.getElementById("password").value,
    		            role:"USER"
    		        })
    		    }
    		);

    		if(response.ok){

    		    document.getElementById("msg").style.display = "block";

    		    setTimeout(() => {
    		        window.location.href = "login.html";
    		    }, 1500);

    		}
    		else{

    		    alert("Registration Failed");
    		}
    }
</script>

</body>
</html>
