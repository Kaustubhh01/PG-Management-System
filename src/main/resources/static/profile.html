<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>My Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f5f7ff;
}

.navbar{
    background:#4f46e5;
    color:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.navbar h2{
    font-size:28px;
}

.logout-btn{
    padding:10px 20px;
    border:none;
    border-radius:5px;
    background:white;
    color:#4f46e5;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.logout-btn:hover{
    background:#ecebff;
}

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px;
}

.profile-card{
    width:650px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.12);
}

.profile-header{
    background:linear-gradient(
        135deg,
        #4f46e5,
        #6366f1
    );
    color:white;
    text-align:center;
    padding:40px;
}

.avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    background:white;
    color:#4f46e5;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    font-weight:bold;
    margin:auto;
    margin-bottom:15px;
}

.profile-header h2{
    margin-bottom:5px;
}

.profile-header p{
    opacity:0.9;
}

.profile-body{
    padding:30px;
}

.info-card{
    background:#f8f9ff;
    border-left:5px solid #4f46e5;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

.label{
    color:#4f46e5;
    font-weight:bold;
    margin-bottom:8px;
}

.value{
    color:#333;
    font-size:18px;
}

.role-badge{
    display:inline-block;
    background:#4f46e5;
    color:white;
    padding:8px 15px;
    border-radius:20px;
    font-size:14px;
    font-weight:bold;
}

.stats{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
    gap:15px;
}

.stat-card{
    flex:1;
    background:#f8f9ff;
    text-align:center;
    padding:20px;
    border-radius:12px;
}

.stat-card h3{
    color:#4f46e5;
    margin-bottom:10px;
}

.stat-card p{
    font-size:22px;
    font-weight:bold;
    color:#333;
}

.profile-input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
    margin-top:8px;
    outline:none;
    transition:0.3s;
}

.profile-input:focus{
    border-color:#4f46e5;
    box-shadow:0 0 8px rgba(79,70,229,0.2);
}

.save-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.save-btn:hover{
    background:#3730a3;
}

</style>

</head>

<body>

<div class="navbar">

    <h2>StayEase</h2>

    <div>

        <button class="logout-btn"
            onclick="window.location.href='dashboard.html'">

            Dashboard

        </button>

        <button class="logout-btn"
            onclick="logout()">

            Logout

        </button>
       

    </div>

</div>

<div class="container">

    <div class="profile-card">

        <div class="profile-header">

            <div class="avatar" id="avatar"></div>

            <h2 id="headerName"></h2>

            <p>StayEase Member</p>

        </div>

        <div class="profile-body">

            <div class="info-card">

                <div class="label">
                    Full Name
                </div>

                <input
    				type="text"
    				id="name"
    				class="profile-input">

            </div>

            <div class="info-card">

                <div class="label">
                    Email Address
                </div>

                <input
				    type="email"
				    id="email"
				    class="profile-input">

            </div>

            <div class="info-card">

                <div class="label">
                    Role
                </div>

                <div class="value">

                    <span
                        class="role-badge"
                        id="role">
                    </span>

                </div>

            </div>

            <div class="stats">

                <div class="stat-card">

                    <h3>User ID</h3>

                    <p id="userId"></p>

                </div>

                <div class="stat-card">

                    <h3>Status</h3>

                    <p>Active</p>

                </div>

            </div>
            
            <div style="margin-top:25px;">

    <button
        class="save-btn"
        onclick="updateProfile()">

        Save Changes

    </button>

</div>

        </div>

    </div>

</div>

<script>

const token =
    localStorage.getItem("token");

const user =
    JSON.parse(
        localStorage.getItem("user")
    );

if(!token || !user){

    window.location.href =
        "login.html";
}

document.getElementById("name")
.value = user.name;

document.getElementById("headerName")
    .innerText = user.name;

document.getElementById("email")
.value = user.email;

document.getElementById("role")
    .innerText = user.role;

document.getElementById("userId")
    .innerText = user.id;

document.getElementById("avatar")
    .innerText =
    user.name.charAt(0).toUpperCase();

function logout(){

    localStorage.removeItem("user");
    localStorage.removeItem("token");

    window.location.href =
        "login.html";
}

async function updateProfile(){

    const response = await fetch(

        `http://localhost:8081/users/update/${user.id}`,

        {
            method:"PUT",

            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + token
            },

            body:JSON.stringify({

                name:
                    document.getElementById("name").value,

                email:
                    document.getElementById("email").value
            })
        }
    );

    if(response.ok){

        const updatedUser =
            await response.json();

        updatedUser.token = token;

        localStorage.setItem(
            "user",
            JSON.stringify(updatedUser)
        );

        alert(
            "Profile Updated Successfully"
        );

        location.reload();
    }
}

</script>

</body>

</html>
