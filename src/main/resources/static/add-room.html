<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Add Room</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f5f7ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#4f46e5;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#3730a3;
}

#message{
    margin-top:15px;
    text-align:center;
    color:green;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

    <h1>Add Room</h1>

    <input type="text"
           id="roomType"
           placeholder="Enter Room Type">

    <input type="number"
           id="price"
           placeholder="Enter Price">

    <input type="text"
           id="availability"
           placeholder="Available / Occupied">

    <input type="text"
           id="imageUrl"
           placeholder="Enter Image URL">

    <button onclick="addRoom()">
        Add Room
    </button>

    <p id="message"></p>

</div>

<script>

const token = localStorage.getItem("token");

if(!token){
    window.location.href = "login.html";
}

async function addRoom(){

    const room = {

        roomType:
            document.getElementById("roomType").value,

        price:
            document.getElementById("price").value,

        availability:
            document.getElementById("availability").value,

        imageUrl:
            document.getElementById("imageUrl").value
    };

    const response = await fetch(
        "http://localhost:8081/rooms/add",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + token
            },

            body:JSON.stringify(room)
        }
    );

    if(response.ok){

        document.getElementById("message")
            .innerText = "Room Added Successfully";

        document.getElementById("roomType").value = "";
        document.getElementById("price").value = "";
        document.getElementById("availability").value = "";
        document.getElementById("imageUrl").value = "";
    }
}

</script>

</body>

</html>
