<!DOCTYPE html>
<html>
<head>
  <title>StayEase | Login</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-container {
      display: flex;
      width: 900px;
      height: 500px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    }

    .left {
      width: 50%;
      position: relative;
      overflow: hidden;
    }

    .left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px;
    }

    .right {
      width: 50%;
      padding: 40px;
      text-align: center;
      background: #f9f9f9;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      width: 95%;
      padding: 10px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #5a67d8;
    }

    .error {
      color: red;
      display: none;
      margin-top: 10px;
    }

    .link {
      margin-top: 15px;
    }

  </style>
</head>

<body>

<div class="main-container">

  <!-- LEFT -->
  <div class="left">
    <img src="https://images.unsplash.com/photo-1554995207-c18c203602cb">

    <div class="overlay">
      <h1>StayEase</h1>
      <p>Smart PG & Hostel Management</p>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <h2>Login</h2>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>

      <button type="submit">Login</button>
    </form>

    <p class="error" id="errorMsg">Invalid credentials</p>

    <div class="link">
      Don't have an account? <a href="index.html">Register</a>
    </div>
  </div>

</div>

<script>

document.getElementById("loginForm").addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        try{

            const response = await fetch(
                "http://localhost:8081/users/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        email:email,
                        password:password
                    })
                }
            );

            if(!response.ok){

                document.getElementById("errorMsg")
                    .style.display = "block";

                document.getElementById("errorMsg")
                    .innerText = "Invalid Credentials";

                return;
            }

            const user = await response.json();

            console.log("Logged User :", user);

            if(user && user.id){

            	localStorage.setItem(
            		    "token",
            		    user.token
            		);

            		localStorage.setItem(
            		    "user",
            		    JSON.stringify(user)
            		);
            		
                alert("Login Successful");

                if(user.role === "ADMIN"){

                    window.location.href =
                        "admin-dashboard.html";
                }
                else{

                    window.location.href =
                        "dashboard.html";
                }
            }
            else{

                document.getElementById("errorMsg")
                    .style.display = "block";

                document.getElementById("errorMsg")
                    .innerText = "Invalid Credentials";
            }

        }
        catch(error){

            console.error(error);

            document.getElementById("errorMsg")
                .style.display = "block";

            document.getElementById("errorMsg")
                .innerText =
                    "Server Error. Please try again.";
        }
    }
);

</script>


</body>
</html>
